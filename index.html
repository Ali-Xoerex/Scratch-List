<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch List — a to-do list you can scribble on</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="desk">
  <div class="notebook">

    <div class="rings" aria-hidden="true"></div>

    <main class="page">

      <header class="page-header">
        <h1 class="title">Scratch List</h1>
        <p class="subtitle">stuff to do, before I forget it</p>
        <div class="date-stamp" id="dateStamp" aria-hidden="true"></div>
      </header>

 <nav class="filters" id="filters" aria-label="Filter by category">
  <button type="button" class="filter-chip active" data-category="">all</button>
  {{range .Categories}}
  <button type="button" class="filter-chip" data-category="{{.}}">{{.}}</button>
  {{end}}
</nav>

<section class="ruled-area" aria-label="Task list">
  <ul class="task-list" id="taskList">
    {{range .Tasks}}
    <li class="task-row{{if .IsDone}} done{{end}}"
        data-id="{{.ID}}"
        data-category="{{.Category}}">
      <span class="check-box">
        <input type="checkbox"
               class="task-check"
               {{if .IsDone}}checked{{end}}
               aria-label="Mark task as done">
        <span class="box"></span>
        <svg viewBox="0 0 30 30"><path d="M6 15.5 L12.5 21 L24 8" /></svg>
        </span>
        <span class="task-text">{{.Name}}</span>
        <span class="category-tag" data-category="{{.Category}}">{{.Category}}</span>
        {{if .Deadline}}
        <span class="deadline-tag" data-deadline="{{.Deadline}}"></span>
        {{end}}
        <button type="button" class="delete-btn" aria-label="Delete task">✕</button>
     </li>
        {{end}}
  </ul>
        <p class="empty-note" id="emptyNote" {{if .Tasks}}hidden{{end}}>
          the page is blank &mdash; jot something down below
        </p>

        <form class="new-task-row" id="newTaskForm" novalidate>
          <span class="pencil-mark" aria-hidden="true">+</span>

          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="write a new task..."
            autocomplete="off"
            required
          >

          <input
            type="text"
            id="categoryInput"
            class="category-input"
            placeholder="category"
            list="categoryOptions"
            autocomplete="off"
            required
          >
          <datalist id="categoryOptions">
            {{range .Categories}}<option value="{{.}}"></option>{{end}}
          </datalist>

          <label class="date-field">
            <input type="date" id="deadlineInput" class="date-input">
          </label>

          <button type="submit" class="add-btn">add it</button>
        </form>
        <p class="form-hint" id="formHint" role="alert"></p>
      </section>

    </main>

    <div class="torn-edge" aria-hidden="true"></div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
